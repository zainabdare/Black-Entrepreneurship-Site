<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nail Salons &amp; Artists | SETLIST Marketplace</title>
  <meta name="description"
    content="Discover Black-owned nail salons, gel-x artists, acrylic specialists, and custom press-on designers within 25 miles of LSU.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Google Fonts: Raleway -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind Configuration with Burgundy, Blush, Cream, Sand & LSU Gold -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Raleway', 'sans-serif'],
            heading: ['Raleway', 'sans-serif'],
            body: ['Raleway', 'sans-serif'],
            script: ['Cathalia', 'cursive'],
          },
          colors: {
            burgundy: {
              DEFAULT: '#4A1C24',
              dark: '#351218',
              light: '#612731',
              hover: '#3D151C',
            },
            blush: {
              DEFAULT: '#E9C6CC',
              light: '#F7E9EC',
              dark: '#D4A7B0',
            },
            cream: {
              DEFAULT: '#F6EEE6',
              light: '#FDFBF8',
              dark: '#ECE2D8',
            },
            sand: {
              DEFAULT: '#EAD5C0',
              light: '#F4E8DC',
              dark: '#D3BAA2',
            },
            lsu: {
              purple: '#4A1C24',
              'purple-dark': '#351218',
              'purple-deep': '#4A1C24',
              'purple-light': '#612731',
              gold: '#FDD023',
              'gold-hover': '#ECC21C',
              'gold-light': '#FEF08A',
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- JavaScript ES Modules (Reusing central controller & ProviderCard) -->
  <script type="module" src="js/app.js?v=4"></script>
</head>

<body data-category="Nails"
  class="bg-[#F6EEE6] text-[#4A1C24] min-h-screen flex flex-col selection:bg-[#E9C6CC] selection:text-[#4A1C24] antialiased">

  <!-- ========================================================================
       HEADER & NAVIGATION
       ======================================================================== -->
  <header class="sticky top-0 z-40 bg-[#F6EEE6]/90 backdrop-blur-md border-b border-[#EAD5C0] transition-all">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 sm:h-20">

        <!-- Site Logo -->
        <a href="index.html"
          class="setlist-logo group focus:outline-none focus-visible:ring-2 focus-visible:ring-[#4A1C24] py-1 select-none"
          aria-label="SETLIST Marketplace Home">
          <span class="setlist-logo-main">SETLIST</span>
          <span class="setlist-logo-sub">MARKETPLACE</span>
        </a>

        <!-- Top Corner Hamburger Menu Button -->
        <div class="flex items-center">
          <button id="hamburger-btn" type="button"
            class="flex items-center gap-2.5 px-4 py-2 rounded-full bg-[#4A1C24] hover:bg-[#351218] text-[#F6EEE6] hover:text-[#FDD023] border border-[#4A1C24] focus:outline-none focus:ring-2 focus:ring-[#FDD023] transition-all shadow-md cursor-pointer"
            aria-expanded="false" aria-controls="slide-out-menu" aria-label="Open navigation menu">
            <span class="text-xs font-heading font-bold uppercase tracking-wider hidden sm:inline-block">Menu</span>
            <svg class="w-5 h-5 stroke-current stroke-2" fill="none" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- ========================================================================
       CONDENSED CATEGORY NAVIGATION ROW
       ======================================================================== -->
  <nav class="w-full bg-[#F6EEE6] border-b border-[#EAD5C0] py-4 sm:py-5 px-4 sm:px-6 lg:px-8"
    aria-label="Category Navigation">
    <div
      class="max-w-7xl mx-auto flex items-center justify-start sm:justify-center gap-2.5 sm:gap-3.5 overflow-x-auto scrollbar-none pb-1">
      <a href="hair.html" class="category-pill category-pill-blush">
        Hair
      </a>
      <a href="nails.html" class="category-pill category-pill-active" aria-current="page">
        Nails
      </a>
      <a href="lashes.html" class="category-pill category-pill-blush">
        Lashes
      </a>
      <a href="food-and-beverages.html" class="category-pill category-pill-sand">
        Food &amp; Beverages
      </a>
      <a href="fashion.html" class="category-pill category-pill-blush">
        Fashion
      </a>
      <a href="photography.html" class="category-pill category-pill-sand">
        Photography
      </a>
    </div>
  </nav>

  <!-- ========================================================================
       CATEGORY HEADER BANNER (Editorial Photo & Overlapping Chunky Headline)
       ======================================================================== -->
  <section class="relative pt-6 sm:pt-10 pb-8 sm:pb-12 bg-[#F6EEE6]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

      <!-- Breadcrumb Link -->
      <div class="max-w-6xl mx-auto mb-4">
        <a href="index.html"
          class="inline-flex items-center gap-1.5 text-xs text-[#7A535A] hover:text-[#4A1C24] transition-colors font-heading font-semibold">
          <span>&larr;</span>
          <span>Back to All Directory Categories</span>
        </a>
      </div>

      <!-- Category Header Text (Headline ABOVE the banner) -->
      <div class="max-w-4xl mx-auto mb-6 sm:mb-8 text-center flex flex-col items-center">
        <!-- Category Headline -->
        <h1
          class="text-3xl sm:text-5xl md:text-6xl font-heading font-light text-[#4A1C24] tracking-[0.2em] uppercase leading-tight sm:leading-none select-none">
          NAILS THAT <span class="category-script-accent">inspire</span>
        </h1>
      </div>

      <!-- Scrolling Banner Carousel (Seamless continuous loop of full-height collage photos) -->
      <div class="category-marquee-wrapper relative mx-auto max-w-6xl">
        <div class="category-marquee-track" aria-label="Endless scrolling banner of nail art photos">
          <div class="category-marquee-group">
            <img src="images/categories/nails_banner.jpg"
              alt="Collage of nail art styles including sculpted acrylics, Gel-X extensions, french tips, chrome finishes, and custom luxury designs"
              class="category-banner-img" loading="eager" />
            <img src="images/categories/nails_banner.jpg" alt="" aria-hidden="true" class="category-banner-img"
              loading="eager" />
          </div>
          <div class="category-marquee-group" aria-hidden="true">
            <img src="images/categories/nails_banner.jpg" alt="" class="category-banner-img" loading="lazy" />
            <img src="images/categories/nails_banner.jpg" alt="" class="category-banner-img" loading="lazy" />
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- ========================================================================
       SECTION 2: SEARCH & QUICK FILTERS (BLUSH PINK BACKGROUND)
       Alternates color to Blush Pink (#E9C6CC)
       ======================================================================== -->
  <section class="bg-[#E9C6CC]/35 border-y border-[#D4A7B0] py-6 sm:py-8">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 text-center">

      <!-- Category Search Bar -->
      <form id="hero-search-form" class="max-w-2xl mx-auto mb-4" role="search" onsubmit="event.preventDefault();">
        <div
          class="relative flex items-center p-1.5 sm:p-2 rounded-full bg-white border border-[#EAD5C0] shadow-md focus-within:border-[#4A1C24] focus-within:ring-2 focus-within:ring-[#4A1C24]/10 transition-all">
          <div class="pl-3.5 sm:pl-4 text-[#4A1C24]/60 pointer-events-none">
            <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
          <input id="hero-search-input" type="search"
            placeholder="Search by style (gel-x, acrylic, nail art, press-ons...)"
            class="w-full pl-3 pr-3 py-2 bg-transparent text-[#4A1C24] text-xs sm:text-sm placeholder-[#7A535A]/60 focus:outline-none font-sans"
            aria-label="Search nail techs">
          <button type="submit" id="hero-search-btn"
            class="px-5 py-2 sm:px-6 sm:py-2.5 rounded-full bg-[#4A1C24] hover:bg-[#351218] text-[#F6EEE6] font-heading font-black text-xs uppercase tracking-wider transition-all cursor-pointer shrink-0">
            Search
          </button>
        </div>
      </form>

      <!-- Quick Filter Chips -->
      <div class="flex flex-wrap items-center justify-center gap-2 text-xs text-[#7A535A] max-w-lg mx-auto">
        <span class="font-heading font-bold uppercase tracking-wider text-[#4A1C24] text-[11px]">Quick Filters:</span>
        <button type="button"
          class="search-tag-chip px-3 py-1 rounded-full bg-white hover:bg-[#4A1C24] border border-[#EAD5C0] hover:border-[#4A1C24] text-[#4A1C24] hover:text-[#F6EEE6] font-medium transition-colors shadow-sm cursor-pointer">
          Gel-X
        </button>
        <button type="button"
          class="search-tag-chip px-3 py-1 rounded-full bg-white hover:bg-[#4A1C24] border border-[#EAD5C0] hover:border-[#4A1C24] text-[#4A1C24] hover:text-[#F6EEE6] font-medium transition-colors shadow-sm cursor-pointer">
          Acrylic
        </button>
        <button type="button"
          class="search-tag-chip px-3 py-1 rounded-full bg-white hover:bg-[#4A1C24] border border-[#EAD5C0] hover:border-[#4A1C24] text-[#4A1C24] hover:text-[#F6EEE6] font-medium transition-colors shadow-sm cursor-pointer">
          Nail Art
        </button>
        <button type="button"
          class="search-tag-chip px-3 py-1 rounded-full bg-white hover:bg-[#4A1C24] border border-[#EAD5C0] hover:border-[#4A1C24] text-[#4A1C24] hover:text-[#F6EEE6] font-medium transition-colors shadow-sm cursor-pointer">
          Press-Ons
        </button>
      </div>

    </div>
  </section>

  <!-- ========================================================================
       SECTION 3: DIRECTORY LISTINGS (CREAM BACKGROUND)
       Alternates color back to Cream (#F6EEE6)
       ======================================================================== -->
  <main id="main-directory-content"
    class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10 sm:py-14 bg-[#F6EEE6]">

    <!-- Dynamic Category Filter Panel (Control Bar, Mobile Drawer & Desktop Panel) -->
    <div id="filter-panel-mount"></div>

    <!-- Provider Grid (Nail Providers with Tab Labels and Rounded Photos) -->
    <div id="providers-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8" role="region"
      aria-label="Nails Provider Listings">
      <!-- Injected by ProviderCard component -->
    </div>

  </main>

  <!-- ========================================================================
       SECTION 5: FOOTER (DARK BURGUNDY BACKGROUND)
       ======================================================================== -->
  <footer class="border-t border-[#4A1C24] bg-[#351218] text-[#E9C6CC] py-8 text-xs text-center">
    <div class="max-w-7xl mx-auto px-4 font-sans">
      <p>&copy; 2026 <strong class="font-bold">SETLIST</strong> Marketplace</p>
    </div>
  </footer>

</body>

</html>
